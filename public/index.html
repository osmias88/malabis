<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Discover Pakistani fashion from leading brands, curated by Malabis Studio for shoppers across the United States." />
    <title>Malabis Studio — Pakistani Fashion, Curated</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-bar">
        <div class="header-left">
          <button id="rail-open" class="icon-button rail-open" type="button" aria-label="Browse brands" aria-controls="brand-rail" aria-expanded="false">
            <span class="hamburger-icon" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="rail-open-label">Brands</span>
          </button>
          <label class="search-box">
            <span class="visually-hidden">Search pieces</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <input id="search" type="search" placeholder="Search" autocomplete="off" />
          </label>
        </div>
        <a class="wordmark" href="/" aria-label="Malabis Studio home"><span class="wordmark-name">MALABIS</span><span class="wordmark-studio">STUDIO</span></a>
        <div class="header-actions">
          <span class="location">Shipping across the US</span>
          <button id="account-button" class="account-button" type="button">Sign in</button>
          <button id="bag-button" class="bag-button" type="button" aria-label="Bag, 0 pieces">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Z" /><path d="M9 8V6a3 3 0 0 1 6 0v2" /></svg>
            <span id="bag-count" class="bag-count" hidden>0</span>
          </button>
        </div>
      </div>
      <nav id="audience-tabs" class="audience-tabs" aria-label="Shop by">
        <a href="?tab=women" data-tab="women">Women</a>
        <a href="?tab=men" data-tab="men">Men</a>
        <a href="?tab=girls" data-tab="girls">Girls</a>
        <a href="?tab=boys" data-tab="boys">Boys</a>
      </nav>
    </header>

    <div class="shell">
      <aside id="brand-rail" class="brand-rail" aria-label="Brands">
        <div class="rail-head">
          <p class="eyebrow">Brands</p>
          <button id="rail-close" class="rail-close" type="button" aria-label="Close brands">×</button>
        </div>
        <nav id="brand-list" class="brand-list"></nav>
      </aside>
      <div id="rail-scrim" class="rail-scrim" hidden></div>

      <main id="main" class="main">
        <section id="home" class="home" aria-label="Featured" hidden>
          <section class="home-block" aria-labelledby="brands-title">
            <div class="block-head">
              <h2 id="brands-title">Shop by brand</h2>
            </div>
            <div id="brand-strip" class="brand-strip"></div>
          </section>
          <div id="brand-rows" class="brand-rows"></div>
        </section>

        <section id="listing" class="listing" aria-labelledby="listing-title">
          <div class="listing-head">
            <div>
              <p id="listing-eyebrow" class="eyebrow">All brands</p>
              <h1 id="listing-title">Newest arrivals</h1>
            </div>
            <div id="active-chips" class="active-chips"></div>
          </div>
          <div id="section-chips" class="section-chips" role="tablist" aria-label="Sections"></div>
          <div class="toolbar">
            <p id="result-count" class="result-count" aria-live="polite">Loading pieces…</p>
            <div class="toolbar-controls">
              <label><span class="visually-hidden">Size</span><select id="size"><option value="all">All sizes</option></select></label>
              <label><span class="visually-hidden">Sort by</span>
                <select id="sort">
                  <option value="newest">Newest first</option>
                  <option value="price-asc">Price: low to high</option>
                  <option value="price-desc">Price: high to low</option>
                </select>
              </label>
            </div>
          </div>
          <div id="status" class="notice" aria-live="polite">Gathering the latest collection…</div>
          <div id="grid" class="product-grid" aria-busy="true"></div>
          <div class="more-wrap"><button id="show-more" class="more-button" type="button" hidden>Show more</button></div>
        </section>
      </main>
    </div>

    <footer>
      <a class="wordmark footer-mark" href="/" aria-label="Malabis Studio home"><span class="wordmark-name">MALABIS</span><span class="wordmark-studio">STUDIO</span></a>
      <p>Prices and availability are synchronized with each brand's own store. <span id="updated"></span></p>
    </footer>

    <!-- Product details -->
    <div id="drawer" class="drawer" hidden>
      <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <button id="drawer-close" class="drawer-close" type="button" aria-label="Close product details">×</button>
        <div id="drawer-body"></div>
      </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="auth-modal" hidden>
      <div class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <button id="auth-close" class="drawer-close" type="button" aria-label="Close account dialog">×</button>
        <p class="eyebrow">Your Malabis account</p>
        <h2 id="auth-title">Sign in</h2>
        <p id="auth-message" class="auth-message" aria-live="polite"></p>
        <form id="auth-form" class="auth-form">
          <label id="auth-name-field" hidden><span>Full name</span><input id="auth-name" type="text" autocomplete="name" maxlength="80" /></label>
          <label id="auth-email-field"><span>Email</span><input id="auth-email" type="email" autocomplete="email" required /></label>
          <label id="auth-password-field"><span>Password</span><input id="auth-password" type="password" minlength="6" autocomplete="current-password" required /></label>
          <button id="auth-forgot" class="auth-forgot" type="button">Forgot your password?</button>
          <button id="auth-submit" class="shop-link" type="submit">Sign in</button>
        </form>
        <button id="google-auth" class="google-button" type="button">
          <svg class="google-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span>Continue with Google</span>
        </button>
        <button id="auth-mode" class="auth-switch" type="button">New to Malabis? Create an account</button>
      </div>
    </div>

    <!-- Bag -->
    <div id="bag-panel" class="side-panel" hidden>
      <section class="side-panel-inner" role="dialog" aria-modal="true" aria-labelledby="bag-title">
        <header class="side-panel-head">
          <h2 id="bag-title">Your bag</h2>
          <button class="side-panel-close" type="button" aria-label="Close bag">×</button>
        </header>
        <div id="bag-body" class="side-panel-body"></div>
        <footer id="bag-footer" class="side-panel-foot"></footer>
      </section>
    </div>

    <!-- Account -->
    <div id="account-panel" class="side-panel" hidden>
      <section class="side-panel-inner" role="dialog" aria-modal="true" aria-labelledby="account-title">
        <header class="side-panel-head">
          <h2 id="account-title">Account</h2>
          <button class="side-panel-close" type="button" aria-label="Close account">×</button>
        </header>
        <div id="account-body" class="side-panel-body"></div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
