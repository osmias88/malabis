name: Refresh product catalog

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      brand:
        description: Brand to ingest
        required: true
        default: all
        type: choice
        options:
          - all
          - sapphire-pk
          - ethnic-pk
          - cambridge-pk
          - sana-safinaz-pk
          - afrozeh-pk
      limit:
        description: Maximum products per brand
        required: true
        default: '400'
        type: string
      mode:
        description: Refresh mode
        required: true
        default: stock
        type: choice
        options:
          - stock
          - catalog

permissions:
  contents: read

concurrency:
  group: catalog-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: malabis
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INGEST_BRAND: ${{ inputs.brand || 'all' }}
      INGEST_LIMIT: ${{ inputs.limit || '400' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate code
        run: |
          npm run typecheck
          npm test

      - name: Ingest catalog
        shell: bash
        run: |
          MODE="${{ inputs.mode || 'stock' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then MODE="catalog"; else MODE="stock"; fi
          fi
          if [ "$INGEST_BRAND" = "all" ]; then
            npm run ingest -- --all --mode "$MODE" --limit "$INGEST_LIMIT"
          else
            npm run ingest -- --brand "$INGEST_BRAND" --mode "$MODE" --limit "$INGEST_LIMIT"
          fi